<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>회원가입 이메일 인증</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>
<body style="margin:0;padding:0;background:#f4f4f7;font-family:ʼApple SD Gothic Neoʼ,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0">
  <tr>
    <td align="center" style="padding:20px 0;">
      <!-- 이메일 본문 컨테이너 -->
      <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.1);">

        <!-- 헤더 -->
        <tr>
          <td align="center" style="background:#2d8cf0;padding:30px;">
            <h1 style="margin:0;color:#ffffff;font-size:24px;">Ping Pong Gang</h1>
          </td>
        </tr>

        <!-- 인사말 -->
        <tr>
          <td style="padding:30px 40px 10px 40px;color:#333333;font-size:16px;line-height:1.5;">
            <p style="margin:0 0 10px 0;">안녕하세요,</p>
            <p style="margin:0 0 20px 0;">Ping Pong Gang에 오신 것을 환영합니다!<br/>아래 인증 코드를 회원가입 시 입력해주세요.</p>
          </td>
        </tr>

        <!-- 인증 코드 박스 -->
        <tr>
          <td align="center" style="padding:10px 40px 30px 40px;">
            <div style="display:inline-block;padding:15px 25px;background:#f0f4ff;border:2px dashed #2d8cf0;border-radius:4px;font-size:24px;letter-spacing:4px;color:#2d8cf0;font-weight:bold;">
              {{VERIFICATION_CODE}}
            </div>
          </td>
        </tr>

        <!-- 추가 안내 -->
        <tr>
          <td style="padding:0 40px 30px 40px;color:#666666;font-size:14px;line-height:1.4;">
            <p style="margin:0;">• 인증 코드는 발송 후 3분간 유효합니다.</p>
            <p style="margin:8px 0 0 0;">• 본인이 요청하지 않은 경우, 이 메일을 무시해주세요.</p>
          </td>
        </tr>

        <!-- 푸터 -->
        <tr>
          <td align="center" style="background:#f4f4f7;padding:20px;color:#999999;font-size:12px;">
            Ping Pong Gang<br/>
            &copy; 2025 Ping Pong Gang. All rights reserved.
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
